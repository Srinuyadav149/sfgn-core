[package]
name = "sfgn-extract-code"
version = "0.1.0"
edition = "2024"
description = "Polyglot tree-sitter source code graph compiler emitting validated code.sfgn"

[features]
default = ["rust"]
rust = ["dep:tree-sitter-rust"]
python = ["dep:tree-sitter-python"]
typescript = ["dep:tree-sitter-typescript"]
all-languages = ["rust", "python", "typescript"]

[dependencies]
sfgn-core = { path = "../.." }
ignore = "0.4.34"
tree-sitter = "0.27.2"
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
